[workspace]
members = ["crates/meku", "crates/meku-buffer", "crates/meku-index", "crates/meku-markdown", "crates/meku-vault"]
resolver = "2"

[workspace.dependencies]
# Latest verified via cargo search + Context7 docs (2026-10-08):
# gpui-pre 0.3.8, gpui-kit 0.7.1. Kit umbrella re-exports matched GPUI.
# App never lists GPUI directly; exact pin per CHECKLIST 1C.
gpui-kit = "=0.7.1"
anyhow = "1"
notify = "8"
pulldown-cmark = "0.13"
ropey = { version = "2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

meku-buffer = { path = "crates/meku-buffer" }
meku-index = { path = "crates/meku-index" }
meku-markdown = { path = "crates/meku-markdown" }
meku-vault = { path = "crates/meku-vault" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.dev.package."gpui-pre"]
opt-level = 3

[profile.dev.package."gpui-kit"]
opt-level = 3
