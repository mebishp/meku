[workspace]
members = ["crates/meku", "crates/meku-buffer", "crates/meku-index", "crates/meku-markdown", "crates/meku-table", "crates/meku-vault"]
resolver = "2"

[workspace.dependencies]
# Latest verified via cargo search + Context7 docs (2026-10-08):
# gpui-pre 0.3.8, gpui-kit 0.7.1. Kit umbrella re-exports matched GPUI.
# App never lists GPUI directly; exact pin per CHECKLIST 1C.
gpui-kit = "=0.7.1"
anyhow = "1"
notify = "8"
pulldown-cmark = "0.13"
regex = "1"
ropey = { version = "2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

meku-buffer = { path = "crates/meku-buffer" }
meku-index = { path = "crates/meku-index" }
meku-markdown = { path = "crates/meku-markdown" }
meku-table = { path = "crates/meku-table" }
meku-vault = { path = "crates/meku-vault" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.dev.package."gpui-pre"]
opt-level = 3

[profile.dev.package."gpui-kit"]
opt-level = 3

# Hot paths of the editor (parse on every keystroke, rope edits, search):
# unoptimized they cost ~6x more, which shows up as typing lag in dev builds.
[profile.dev.package.meku-markdown]
opt-level = 3
[profile.dev.package.meku-buffer]
opt-level = 3
[profile.dev.package.meku-table]
opt-level = 3
[profile.dev.package.pulldown-cmark]
opt-level = 3
[profile.dev.package.ropey]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
