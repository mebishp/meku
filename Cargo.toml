[workspace]
members = ["crates/meku"]
resolver = "2"

[workspace.dependencies]
# Latest verified via cargo search + Context7 docs (2026-10-08):
# gpui-pre 0.3.8, gpui-kit 0.7.1. Kit umbrella re-exports matched GPUI.
gpui-kit = "0.7.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.dev.package."gpui-pre"]
opt-level = 3

[profile.dev.package."gpui-kit"]
opt-level = 3
