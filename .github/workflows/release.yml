name: Release

# Builds the Linux (deb, AppImage, Arch, tar.gz), macOS (Apple silicon) and Windows (x64) packages.
# Linux is built on ubuntu-22.04 on purpose: a binary runs on any system with the same or a newer glibc.
#  - Push a tag like v1.0.1: builds both and attaches them to that tag's GitHub release.
#  - Run it by hand (Actions > Release > Run workflow): builds both and keeps the files
#    as workflow artifacts, without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (deb, AppImage, Arch, tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang pkg-config librsvg2-bin zstd binutils curl \
            libfontconfig-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and package
        run: tools/package.sh

      - name: Smoke test the packages
        run: |
          ls -la dist
          # The .deb installs, pulling in its dependencies, and nothing is left unresolved.
          sudo apt-get install -y ./dist/meku_*_amd64.deb
          if ldd /usr/bin/meku | grep "not found"; then echo "unresolved libraries in the .deb"; exit 1; fi
          dpkg -s meku | grep -E '^(Package|Version|Depends)'
          # The AppImage carries its libraries and they resolve.
          chmod +x dist/Meku-*.AppImage
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/dist/Meku-*.AppImage --appimage-extract >/dev/null)
          LD_LIBRARY_PATH="$RUNNER_TEMP/squashfs-root/usr/lib" ldd "$RUNNER_TEMP/squashfs-root/usr/bin/meku" | tee /dev/stderr | { ! grep "not found"; }
          # The Arch package and tarball hold what they should.
          tar -I zstd -tf dist/meku-*-x86_64.pkg.tar.zst | grep -x '.PKGINFO'
          tar -tzf dist/meku-*-x86_64-linux.tar.gz | grep INSTALL.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/meku_*_amd64.deb
            dist/Meku-*-x86_64.AppImage
            dist/meku-*-x86_64.pkg.tar.zst
            dist/meku-*-x86_64-linux.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (Apple silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p meku

      - name: Package (.app, .dmg, .zip)
        run: tools/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/Meku-*-macos-arm64.dmg
            dist/Meku-*-macos-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p meku

      - name: Package (.zip)
        shell: pwsh
        run: |
          $ver = (Select-String -Path crates/meku/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $dir = "Meku-$ver-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$dir" | Out-Null
          Copy-Item target/release/meku.exe "dist/$dir/Meku.exe"
          Copy-Item LICENSE, README.MD "dist/$dir/"
          Compress-Archive -Path "dist/$dir" -DestinationPath "dist/$dir.zip" -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/Meku-*-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create the release if needed, then upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd packages && sha256sum * > SHA256SUMS)
          cat packages/SHA256SUMS
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Meku ${TAG#v}" --generate-notes
          gh release upload "$TAG" packages/* --clobber
