name: Release

# Builds the macOS (Apple silicon) and Windows (x64) packages.
#  - Push a tag like v1.0.1: builds both and attaches them to that tag's GitHub release.
#  - Run it by hand (Actions > Release > Run workflow): builds both and keeps the files
#    as workflow artifacts, without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (Apple silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p meku

      - name: Package (.app, .dmg, .zip)
        run: tools/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/Meku-*-macos-arm64.dmg
            dist/Meku-*-macos-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p meku

      - name: Package (.zip)
        shell: pwsh
        run: |
          $ver = (Select-String -Path crates/meku/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $dir = "Meku-$ver-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$dir" | Out-Null
          Copy-Item target/release/meku.exe "dist/$dir/Meku.exe"
          Copy-Item LICENSE, README.MD "dist/$dir/"
          Compress-Archive -Path "dist/$dir" -DestinationPath "dist/$dir.zip" -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/Meku-*-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create the release if needed, then upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la packages
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Meku ${TAG#v}" --generate-notes
          gh release upload "$TAG" packages/* --clobber
