<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="250" rx="16" fill="#1b1d29"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#e6e9f5">Typing never makes you wait</text>
  <text x="32" y="66" font-size="13" fill="#9aa3c4">Time per keystroke in a 10,000-line note (shorter is better)</text>

  <text x="32" y="112" font-size="14" fill="#e6e9f5">Meku</text>
  <rect x="200" y="96" width="97" height="22" rx="6" fill="#7aa2f7"/>
  <text x="308" y="113" font-size="14" font-weight="700" fill="#7aa2f7">5 ms</text>

  <text x="32" y="162" font-size="14" fill="#9aa3c4">One frame at 60 fps</text>
  <rect x="200" y="146" width="310" height="22" rx="6" fill="#3a4060"/>
  <text x="522" y="163" font-size="14" fill="#9aa3c4">16 ms</text>

  <text x="32" y="212" font-size="13" fill="#9aa3c4">Measured on a release build, including drawing the frame. Only the part of the note you are editing is re-read.</text>
</svg>
