[package]
name = "meku"
version = "1.0.2"
edition = "2024"
rust-version = "1.92"

[[bin]]
name = "meku"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
gpui-kit = { workspace = true }
meku-buffer = { workspace = true }
meku-index = { workspace = true }
meku-markdown = { workspace = true }
meku-table = { workspace = true }
meku-vault = { workspace = true }
notify = { workspace = true }
rfd = "0.17"
regex = { workspace = true }
imagesize = "0.15"
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Headless UI integration tests (#[gpui_kit::test], TestWindowExt).
gpui-kit = { workspace = true, features = ["test-support"] }
